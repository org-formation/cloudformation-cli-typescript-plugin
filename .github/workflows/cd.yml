# Continuous Delivery (Release)
name: cd

on:
  push:
    tags:
      - 'v*'

jobs:
  delivery-nodejs:
    name: Prepare for NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Get Version from Git Tag
        id: tag_name
        run: |
          echo "VERSION=$(echo ${GITHUB_REF:11})" >> $GITHUB_ENV
      - name: Install Dependencies and Package Project
        id: installing
        run: |
          npm ci --optional
          npm pack
      - name: Upload NPM Artifacts
        id: upload_npm
        uses: actions/upload-artifact@v4
        with:
          name: package-npm
          path: cfn-rpdk-${{ env.VERSION }}.tgz

  delivery-python:
    name: Prepare for PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dependencies and Package Project
        id: installing
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python3 setup.py sdist bdist_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist

  delivery-github:
    name: Delivery to GitHub
    needs: [delivery-nodejs, delivery-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NPM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-npm
      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/
      - name: List Artifacts
        run: |
          echo 'ARTIFACTS="$(echo package-npm/* && echo dist/*)"' >> $GITHUB_ENV
      - name: GitHub Release
        id: releasing
        uses: docker://antonyurchenko/git-release:v3.4.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_RELEASE: 'false'
          PRE_RELEASE: 'true'
          CHANGELOG_FILE: 'CHANGELOG.md'
          ALLOW_EMPTY_CHANGELOG: 'false'
          ALLOW_TAG_PREFIX: 'true'
        with:
          args: |
              ${{ env.ARTIFACTS }}
